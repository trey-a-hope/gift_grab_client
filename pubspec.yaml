name: gift_grab_client
description: A game made using Flame where users grab presents to increase their scores.
publish_to: "none"
version: 26.7.1+80

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  animated_search_bar: ^2.8.0
  bloc_error_handler: ^0.0.6
  bloc_test: ^10.0.0
  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^9.2.4
  font_awesome_flutter: ^11.0.0
  formz: ^0.8.0
  gap: ^3.0.1
  get_it: ^9.2.1
  gift_grab_game:
    git: https://github.com/trey-a-hope/gift_grab_game.git
  gift_grab_ui:
    git: https://github.com/trey-a-hope/gift_grab_ui.git
  go_router: ^17.0.1
  google_fonts: ^8.0.0
  google_sign_in: ^6.3.0
  intl: ^0.20.2
  logger: ^2.6.1
  lottie: ^3.3.2
  mocktail: ^1.0.4
  nakama: ^1.3.0
  package_info_plus: ^9.0.0
  profanity_api: ^0.0.1
  settings_ui: ^3.0.1
  shadcn_ui: ^0.55.0
  signals: ^7.1.0
  sign_in_with_apple: ^7.0.1
  universal_platform: ^1.1.0
  window_manager: ^0.5.1
  flutter_launcher_icons: ^0.14.4
  collection: ^1.19.1
  clerk_flutter: ^0.0.18-beta
  webview_flutter: ^4.14.1
  webview_flutter_wkwebview: ^3.26.0
  webview_flutter_platform_interface: ^2.15.1
  result_dart: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
    - shorebird.yaml

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "ic_launcher"
  adaptive_icon_foreground: "assets/icon/icon.png"
  adaptive_icon_background: "#000000"
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
